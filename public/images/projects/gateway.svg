<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#7A2A0E"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg1)"/>
  <!-- Code & Terminal Mockup -->
  <g transform="translate(60, 60)" fill="none">
    <rect width="680" height="720" rx="8" fill="#181514" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <rect width="680" height="54" rx="8" fill="#241F1C"/>
    <circle cx="36" cy="27" r="6" fill="#C85A32"/>
    <circle cx="58" cy="27" r="6" fill="#E59B34"/>
    <circle cx="80" cy="27" r="6" fill="#4A6B58"/>
    <text x="340" y="33" fill="#B5ADA6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="600">gateway/router.go • 1.2ms latency</text>

    <!-- Code Editor Content -->
    <g transform="translate(40, 95)" font-family="monospace" font-size="14" font-weight="500">
      <text y="30" fill="#E59B34">package</text><text x="75" y="30" fill="#FFFFFF">main</text>
      <text y="70" fill="#E59B34">func</text><text x="45" y="70" fill="#FFFFFF"> RouteTraffic(c *gin.Context) {</text>
      <text x="24" y="105" fill="#4A6B58">// Rate-limit check via Redis pipeline</text>
      <text x="24" y="140" fill="#FFFFFF">limiter := redis.NewTokenBucket(c.ClientIP())</text>
      <text x="24" y="175" fill="#E59B34">if</text><text x="45" y="175" fill="#FFFFFF"> !limiter.Allow() {</text>
      <text x="48" y="210" fill="#C85A32">c.AbortWithStatus(429)</text>
      <text x="48" y="245" fill="#E59B34">return</text>
      <text x="24" y="280" fill="#FFFFFF">}</text>
      <text x="24" y="325" fill="#4A6B58">// Forward upstream proxy</text>
      <text x="24" y="360" fill="#FFFFFF">proxy.ServeHTTP(c.Writer, c.Request)</text>
      <text y="400" fill="#FFFFFF">}</text>
    </g>

    <!-- Metrics Bar -->
    <g transform="translate(40, 540)">
      <rect width="600" height="120" rx="6" fill="#241F1C" stroke="rgba(255,255,255,0.08)"/>
      <text x="24" y="35" fill="#B5ADA6" font-family="sans-serif" font-size="12" font-weight="600">THROUGHPUT: 125,000 REQ/SEC</text>
      <text x="420" y="35" fill="#4A6B58" font-family="sans-serif" font-size="12" font-weight="700">STATUS: HEALTHY</text>
      <rect x="24" y="52" width="552" height="12" rx="6" fill="#181514"/>
      <rect x="24" y="52" width="480" height="12" rx="6" fill="#E59B34"/>
      <text x="24" y="95" fill="#F2EFEA" font-family="sans-serif" font-size="13">Average response time: 0.84ms • P99: 2.1ms</text>
    </g>
  </g>
</svg>

