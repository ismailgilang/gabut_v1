<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6B58"/>
      <stop offset="100%" stop-color="#2D4436"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg3)"/>
  <g transform="translate(60, 60)" fill="none">
    <!-- Window Frame -->
    <rect width="680" height="720" rx="8" fill="#1C1816" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Window Bar -->
    <rect width="680" height="54" rx="8" fill="#292320"/>
    <circle cx="36" cy="27" r="6" fill="#4A6B58"/>
    <circle cx="58" cy="27" r="6" fill="rgba(255,255,255,0.2)"/>
    <circle cx="80" cy="27" r="6" fill="rgba(255,255,255,0.2)"/>
    <text x="340" y="33" fill="#B5ADA6" font-family="monospace" font-size="14" text-anchor="middle" font-weight="600">resonance-audio / canvas</text>

    <!-- Waveform Visualizer -->
    <g transform="translate(60, 110)">
      <rect width="560" height="230" rx="6" fill="#241F1C"/>
      <path d="M 30 115 Q 100 20, 170 115 T 310 115 T 450 115 T 530 115" stroke="#E59B34" stroke-width="4" fill="none"/>
      <path d="M 30 115 Q 80 180, 160 115 T 300 115 T 440 115 T 530 115" stroke="#4A6B58" stroke-width="3" stroke-dasharray="6,6" fill="none"/>
    </g>

    <!-- 3 Hardware Rotational Knobs -->
    <g transform="translate(100, 410)">
      <!-- Knob 1 -->
      <g transform="translate(0, 0)">
        <circle cx="60" cy="60" r="54" fill="#2A2420" stroke="#4A6B58" stroke-width="4"/>
        <circle cx="60" cy="60" r="38" fill="#38302A"/>
        <line x1="60" y1="20" x2="60" y2="42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
        <text x="60" y="148" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">FREQ</text>
      </g>

      <!-- Knob 2 -->
      <g transform="translate(180, 0)">
        <circle cx="60" cy="60" r="54" fill="#2A2420" stroke="#E59B34" stroke-width="4"/>
        <circle cx="60" cy="60" r="38" fill="#38302A"/>
        <line x1="84" y1="36" x2="68" y2="52" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
        <text x="60" y="148" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">RESO</text>
      </g>

      <!-- Knob 3 -->
      <g transform="translate(360, 0)">
        <circle cx="60" cy="60" r="54" fill="#2A2420" stroke="#C85A32" stroke-width="4"/>
        <circle cx="60" cy="60" r="38" fill="#38302A"/>
        <line x1="36" y1="36" x2="52" y2="52" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
        <text x="60" y="148" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">DRIVE</text>
      </g>
    </g>

    <text x="340" y="650" fill="#B5ADA6" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="500">
      TOUCH-FIRST MODULATION CONTROLS
    </text>
  </g>
</svg>

