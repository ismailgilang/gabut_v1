<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59B34"/>
      <stop offset="100%" stop-color="#A86812"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg2)"/>
  <g transform="translate(60, 60)" fill="none">
    <!-- Window Frame -->
    <rect width="680" height="720" rx="8" fill="#1C1816" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Window Bar -->
    <rect width="680" height="54" rx="8" fill="#292320"/>
    <circle cx="36" cy="27" r="6" fill="#C85A32"/>
    <circle cx="58" cy="27" r="6" fill="rgba(255,255,255,0.2)"/>
    <circle cx="80" cy="27" r="6" fill="rgba(255,255,255,0.2)"/>
    <text x="340" y="33" fill="#B5ADA6" font-family="monospace" font-size="14" text-anchor="middle" font-weight="600">letterform-foundry / specimen</text>

    <!-- Large Type Specimen Letter -->
    <text x="340" y="380" fill="#E59B34" font-family="serif" font-size="280" font-weight="700" text-anchor="middle">Ag</text>

    <!-- Controls Panel -->
    <g transform="translate(60, 480)">
      <!-- Slider 1 -->
      <text x="0" y="20" fill="#B5ADA6" font-family="sans-serif" font-size="13" font-weight="600">WEIGHT: 750</text>
      <rect x="0" y="32" width="560" height="8" rx="4" fill="#2E2824"/>
      <rect x="0" y="32" width="420" height="8" rx="4" fill="#E59B34"/>
      <circle cx="420" cy="36" r="10" fill="#FFFFFF"/>

      <!-- Slider 2 -->
      <text x="0" y="80" fill="#B5ADA6" font-family="sans-serif" font-size="13" font-weight="600">WIDTH: 85%</text>
      <rect x="0" y="92" width="560" height="8" rx="4" fill="#2E2824"/>
      <rect x="0" y="92" width="340" height="8" rx="4" fill="#E59B34"/>
      <circle cx="340" cy="96" r="10" fill="#FFFFFF"/>

      <!-- Specimen text phrase -->
      <text x="280" y="160" fill="#FFFFFF" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="500">
        Pack my box with five dozen liquor jugs.
      </text>
    </g>
  </g>
</svg>

