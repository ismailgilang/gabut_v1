<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6B58"/>
      <stop offset="100%" stop-color="#22362B"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg3)"/>
  <g transform="translate(60, 60)" fill="none">
    <rect width="680" height="720" rx="8" fill="#181514" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <rect width="680" height="54" rx="8" fill="#241F1C"/>
    <circle cx="36" cy="27" r="6" fill="#4A6B58"/>
    <circle cx="58" cy="27" r="6" fill="rgba(255,255,255,0.2)"/>
    <circle cx="80" cy="27" r="6" fill="rgba(255,255,255,0.2)"/>
    <text x="340" y="33" fill="#B5ADA6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="600">eventpulse / kafka-stream-consumer</text>

    <!-- Stream nodes diagram -->
    <g transform="translate(40, 90)">
      <rect width="600" height="260" rx="6" fill="#241F1C"/>
      <text x="24" y="32" fill="#B5ADA6" font-family="sans-serif" font-size="12" font-weight="600">LIVE MESSAGE BUS TOPOLOGY</text>

      <!-- Nodes -->
      <g transform="translate(30, 80)">
        <rect width="120" height="90" rx="6" fill="#1C1816" stroke="#4A6B58" stroke-width="2"/>
        <text x="60" y="40" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">PRODUCER</text>
        <text x="60" y="65" fill="#B5ADA6" font-family="sans-serif" font-size="11" text-anchor="middle">REST / WS</text>

        <!-- Arrow 1 -->
        <line x1="130" y1="45" x2="190" y2="45" stroke="#E59B34" stroke-width="3" stroke-dasharray="4,4"/>
        
        <rect x="200" width="140" height="90" rx="6" fill="#1C1816" stroke="#E59B34" stroke-width="2"/>
        <text x="270" y="40" fill="#E59B34" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">KAFKA CLUSTER</text>
        <text x="270" y="65" fill="#B5ADA6" font-family="sans-serif" font-size="11" text-anchor="middle">8 Partitions</text>

        <!-- Arrow 2 -->
        <line x1="350" y1="45" x2="410" y2="45" stroke="#E59B34" stroke-width="3" stroke-dasharray="4,4"/>

        <rect x="420" width="120" height="90" rx="6" fill="#1C1816" stroke="#C85A32" stroke-width="2"/>
        <text x="480" y="40" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">CONSUMER</text>
        <text x="480" y="65" fill="#B5ADA6" font-family="sans-serif" font-size="11" text-anchor="middle">Postgres Sync</text>
      </g>
    </g>

    <!-- Terminal Output Log -->
    <g transform="translate(40, 380)">
      <rect width="600" height="280" rx="6" fill="#141110" stroke="rgba(255,255,255,0.06)"/>
      <g transform="translate(20, 30)" font-family="monospace" font-size="12">
        <text y="0" fill="#4A6B58">[INFO]  2024-03-12T08:14:20Z Stream connection established: client_id=worker-04</text>
        <text y="30" fill="#B5ADA6">[LOG]   Batch ACK received: 500 messages committed to topic 'telemetry.events'</text>
        <text y="60" fill="#E59B34">[METR]  Current processing lag: 0.04ms • Consumer group: synced</text>
        <text y="90" fill="#B5ADA6">[LOG]   WebSocket broadcast dispatched to 1,480 active socket sessions</text>
        <text y="120" fill="#4A6B58">[INFO]  Health check 200 OK • Memory allocation: 42MB / 512MB</text>
        <text y="150" fill="#B5ADA6">[LOG]   Auto-scaling trigger evaluated: replicas normal (count=3)</text>
        <text y="180" fill="#E59B34">[READY] Listening on :8080 (HTTP/2 enabled)</text>
      </g>
    </g>
  </g>
</svg>

