<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#8C3314"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg1)"/>
  <!-- UI Workbench Mockup -->
  <g transform="translate(60, 60)" fill="none">
    <!-- Window Frame -->
    <rect width="680" height="720" rx="8" fill="#1C1816" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Window Bar -->
    <rect width="680" height="54" rx="8" fill="#292320"/>
    <circle cx="36" cy="27" r="6" fill="#E59B34"/>
    <circle cx="58" cy="27" r="6" fill="rgba(255,255,255,0.2)"/>
    <circle cx="80" cy="27" r="6" fill="rgba(255,255,255,0.2)"/>
    <text x="340" y="33" fill="#B5ADA6" font-family="monospace" font-size="14" text-anchor="middle" font-weight="600">kinetic-workflow / queue</text>

    <!-- Sidebar & Table Content -->
    <rect x="24" y="80" width="160" height="610" rx="4" fill="#241F1C"/>
    <!-- Sidebar Items -->
    <rect x="38" y="104" width="130" height="28" rx="4" fill="#C85A32"/>
    <rect x="38" y="144" width="110" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="38" y="170" width="90" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="38" y="196" width="120" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>

    <!-- Main Table Area -->
    <rect x="204" y="80" width="452" height="610" rx="4" fill="#241F1C"/>
    
    <!-- Table Rows -->
    <g transform="translate(224, 110)">
      <!-- Row 1 -->
      <rect width="412" height="54" rx="4" fill="#2E2824" stroke="#C85A32" stroke-width="1.5"/>
      <rect x="16" y="18" width="60" height="16" rx="3" fill="#E59B34"/>
      <rect x="90" y="18" width="140" height="16" rx="3" fill="rgba(255,255,255,0.6)"/>
      <rect x="330" y="18" width="66" height="16" rx="8" fill="#4A6B58"/>
      
      <!-- Row 2 -->
      <g transform="translate(0, 68)">
        <rect width="412" height="54" rx="4" fill="#292320"/>
        <rect x="16" y="18" width="60" height="16" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="90" y="18" width="180" height="16" rx="3" fill="rgba(255,255,255,0.4)"/>
        <rect x="330" y="18" width="66" height="16" rx="8" fill="rgba(255,255,255,0.15)"/>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 136)">
        <rect width="412" height="54" rx="4" fill="#292320"/>
        <rect x="16" y="18" width="60" height="16" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="90" y="18" width="120" height="16" rx="3" fill="rgba(255,255,255,0.4)"/>
        <rect x="330" y="18" width="66" height="16" rx="8" fill="rgba(255,255,255,0.15)"/>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 204)">
        <rect width="412" height="54" rx="4" fill="#292320"/>
        <rect x="16" y="18" width="60" height="16" rx="3" fill="rgba(255,255,255,0.2)"/>
        <rect x="90" y="18" width="160" height="16" rx="3" fill="rgba(255,255,255,0.4)"/>
        <rect x="330" y="18" width="66" height="16" rx="8" fill="rgba(255,255,255,0.15)"/>
      </g>
    </g>

    <!-- Keyboard Shortcut Hint Badge -->
    <g transform="translate(440, 620)">
      <rect width="216" height="42" rx="21" fill="#C85A32"/>
      <text x="108" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">J / K TO NAVIGATE</text>
    </g>
  </g>
</svg>

